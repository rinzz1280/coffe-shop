<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Create Account</title>

<link rel="stylesheet" href="../css/Register.css">


</head>

<body>


<div class="container">

    <div class="title">
        <h1>Create Account</h1>
        <p>Register your account to get started</p>
    </div>

    <form id="formRegister">

        <!-- Full Name -->
        <div class="form-group">

            <label for="full_name">
                Full Name
            </label>

            <input
                type="text"
                id="full_name"
                placeholder="Enter your full name"
                required
            >

        </div>


        <!-- Gender -->
        <div class="form-group">

            <label for="gender">
                Gender
            </label>

            <select id="gender" required>

                <option value="male">
                    ប្រុស
                </option>

                <option value="female">
                    ស្រី
                </option>

            </select>

        </div>


        <!-- Email -->
        <div class="form-group">

            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                placeholder="Example@gmail.com"
                required
            >

        </div>


        <!-- Password -->
        <div class="form-group">

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Enter password"
                required
            >

        </div>


        <button type="submit">
            Register
        </button>

    </form>


    <div class="login-link">

        Already have an account?

        <a href="login.html">
            Login
        </a>

    </div>

</div>


<script src="../js/form.js"></script>


</body>

</html>
