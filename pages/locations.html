
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Brew Haven - Locations</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">

</head>

<body class="bg-gray-100">


    <!-- ================= HEADER ================= -->

    <header class="bg-black text-white">

        <div class="max-w-6xl mx-auto px-6 py-5
            flex items-center justify-between">

            <!-- Logo -->

            <a href="home.html"
                class="flex items-center gap-3">

                <i class="fa-solid fa-mug-hot
                    text-yellow-500 text-2xl"></i>

                <span class="text-2xl font-bold">
                    Brew
                    <span class="text-yellow-500">
                        Haven
                    </span>
                </span>

            </a>


            <!-- Navigation -->

            <nav>

                <ul class="flex gap-8">

                    <li>
                        <a href="home.html"
                            class="hover:text-yellow-500">
                            Home
                        </a>
                    </li>

                    <li>
                        <a href="menu.html"
                            class="hover:text-yellow-500">
                            Menu
                        </a>
                    </li>

                    <li>
                        <a href="locations.html"
                            class="text-yellow-500">
                            Locations
                        </a>
                    </li>

                    <li>
                        <a href="contact.html"
                            class="hover:text-yellow-500">
                            Contact
                        </a>
                    </li>

                </ul>

            </nav>

        </div>

    </header>


    <!-- ================= LOCATION ================= -->

    <main class="max-w-6xl mx-auto px-6 py-16">

        <div class="text-center">

            <p class="text-yellow-600 font-semibold">
                FIND US
            </p>

            <h1 class="text-4xl font-bold mt-3">
                Our Locations
            </h1>

            <p class="text-gray-600 mt-4">
                Visit Brew Haven and enjoy your favorite coffee.
            </p>

        </div>


        <div class="grid grid-cols-1 md:grid-cols-2
            gap-8 mt-12">


            <!-- Location 1 -->

            <div class="bg-white rounded-2xl shadow
                p-8">

                <div class="text-yellow-500 text-3xl mb-5">

                    <i class="fa-solid fa-location-dot"></i>

                </div>

                <h2 class="text-2xl font-bold">
                    Phnom Penh Branch
                </h2>

                <p class="text-gray-600 mt-4">
                    Street 271, Phnom Penh, Cambodia
                </p>

                <p class="text-gray-600 mt-3">
                    <i class="fa-solid fa-phone
                        text-yellow-500 mr-2"></i>

                    +855 12 345 678
                </p>

                <p class="text-gray-600 mt-3">
                    <i class="fa-solid fa-clock
                        text-yellow-500 mr-2"></i>

                    7AM - 9PM
                </p>

            </div>


            <!-- Location 2 -->

            <div class="bg-white rounded-2xl shadow
                p-8">

                <div class="text-yellow-500 text-3xl mb-5">

                    <i class="fa-solid fa-location-dot"></i>

                </div>

                <h2 class="text-2xl font-bold">
                    Toul Kork Branch
                </h2>

                <p class="text-gray-600 mt-4">
                    Toul Kork, Phnom Penh, Cambodia
                </p>

                <p class="text-gray-600 mt-3">
                    <i class="fa-solid fa-phone
                        text-yellow-500 mr-2"></i>

                    +855 12 345 678
                </p>

                <p class="text-gray-600 mt-3">
                    <i class="fa-solid fa-clock
                        text-yellow-500 mr-2"></i>

                    8AM - 10PM
                </p>

            </div>

        </div>

    </main>


    <!-- ================= FOOTER ================= -->

  
</body>

</html>
