<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Products - Admin</title>

    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="../css/admin.css">

</head>

<body>

    <div class="flex min-h-screen">

    <!-- Sidebar -->
<aside class="w-64 bg-gray-900">

        <!-- Logo -->
       <h1 class="text-2xl font-bold mb-10">
             <i class="fa-solid fa-mug-hot logo-icon "></i>
             <div class="logo-text">
                <span>Brew Haven</span>
                </div>
        </h1>



        <!-- Navigation -->
        <nav class="space-y-2">

            <a href="dashboard.html"
               class="">
                <i class="fa-solid fa-chart-line"></i>
                Dashboard
            </a>

            <a href="product.html"
               class="active">
                <i class="fa-solid fa-mug-hot"></i>
                Products
            </a>

            <a href="categories.html"
               class="">
                <i class="fa-solid fa-layer-group"></i>
                Categories
            </a>

            <a href="inventory.html"
               class="">
                <i class="fa-solid fa-boxes-stacked"></i>
                Inventory
            </a>

            <a href="customer.html"
               class="">
                <i class="fa-solid fa-users"></i>
                Customer
            </a>

            <a href="orders.html"
               class="">
                <i class="fa-solid fa-cart-shopping"></i>
                Orders
            </a>
            <a href="payments.html"
               class="">
                <i class="fa-solid fa-wallet"></i>
                Payments
            </a>

            <a href="staffs.html"
               class="">
                <i class="fa-solid fa-clipboard-user"></i>
                Staffs
            </a>

            <a href="reports.html"
               class="">
                <i class="fa-solid fa-chart-simple"></i>
                Reports
            </a>
            
            <a href="settings.html"
               class="">
                <i class="fa-solid fa-gear"></i>
                Settings
            </a>

        </nav>


        <!-- Logout -->
            <button onclick="logout()"
                class="w-full mt-auto bg-red-600 p-3 rounded-lg hover:bg-red-700">

            <i class="fa-solid fa-right-from-bracket mr-2"></i>

            Logout

        </button>
</aside>

    <!-- Main -->
    <main class="main">

        <!-- Header -->
        <header class="header">

            <div>
                <h1>Products</h1>
                <p>Manage your coffee products</p>
            </div>

            <div class="profile">

                <div class="avatar">
                    A
                </div>

                <div>
                    <strong>Admin</strong>
                    <small>Administrator</small>
                </div>

            </div>

        </header>


        <!-- Product Section -->
        <section class="orders">

            <div class="section-header">

                <h2>All Products</h2>

                <button class="add-btn" onclick="openProductForm()">
                    + Add Product   
                </button>

            </div>


            <!-- Search -->
            <div class="search-box">

            <input 
                type="text" 
                id="searchProduct"
                placeholder="Search product by Name..."
                oninput="getProduct()">

            </div>
<!-- Product Form -->
<div class="product-form" id="productForm" style="display: none;">

    <h2 id="formTitle">Add Product</h2>

    <form id="formProduct">

        <input type="hidden" id="productId">

        <div class="form-row">

            <div>
                <label>Product Name</label>
                <input
                    type="text"
                    id="productName"
                    placeholder="Example: Americano"
                    required>
            </div>

            <div>
                <label>Category</label>

                <select id="productCategory" required>
                    <option value="">Select Category</option>
                    <option value="Coffee">Coffee</option>
                    <option value="Tea">Tea</option>
                    <option value="Dessert">Dessert</option>
                </select>
            </div>

        </div>


        <div class="form-row">

            <div>
                <label>Price</label>

                <input
                    type="number"
                    id="productPrice"
                    step="0.01"
                    placeholder="2.50"
                    required>
            </div>


            <div>
                <label>Stock</label>

                <input
                    type="number"
                    id="productStock"
                    placeholder="20"
                    required>
            </div>

        </div>


        <div>
            <label>Image URL</label>

            <input
                type="text"
                id="productImage"
                placeholder="https://example.com/image.jpg">
        </div>


        <div>
            <label>Description</label>

            <textarea
                id="productDescription"
                placeholder="Product description..."></textarea>
        </div>


        <div class="form-buttons">

            <button type="submit" class="save-btn">
                Save Product
            </button>

            <button
                type="button"
                class="cancel-btn"
                onclick="closeProductForm()">

                Cancel

            </button>

        </div>

    </form>

</div>




            <!-- Product Table -->
            <div class="table-container">

                <table>

                    <thead>

                        <tr>
                            <th>#</th>
                            <th>Product</th>
                            <th>Price</th>
                            <th>Stock</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>

                    </thead>

                        <tbody id="productTable"></tbody>

                    </table>

                </div>

            </section>

        </main>
    </div>

</body>
<script src="../js/product.js"></script>
</html>
